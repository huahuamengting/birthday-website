<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f0f7ff">
  <title>Your Birthday Album ✦</title><link rel="icon" href="data:,"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=10">
</head>
<body class="album-page">
  <main class="album-shell">
    <header class="camera-header"><a class="back-link" href="index.html" aria-label="Back to home">←</a><div><span class="eyebrow">A LITTLE BOX OF MEMORIES</span><h1>Your birthday album.</h1></div><span class="header-spark">✦</span></header>
    <div class="album-intro"><p>Your moments, kept close.</p><a class="new-photo-link" href="camera.html">TAKE ANOTHER PHOTO <span>↗</span></a></div>
    <p class="album-count" id="albumCount"></p>
    <section class="album-grid" id="albumGrid" aria-label="Birthday photo album"></section>
    <section class="empty-album" id="emptyAlbum"><span>✧</span><h2>Your album is waiting.</h2><p>Take your first birthday photo and save it here.</p><a class="primary-button" href="camera.html"><span>Take a photo</span><b>↗</b></a></section>
    <p class="album-storage-note">PHOTOS AND MESSAGES STAY ON THIS DEVICE <span>♡</span></p>
  </main>
  <dialog class="photo-dialog" id="photoDialog">
    <div class="dialog-top"><span class="dialog-label">A MOMENT TO REMEMBER</span><button class="dialog-close" id="closeDialog" type="button" aria-label="Close photo">×</button></div>
    <div class="memory-image-wrap"><img id="dialogPhoto" alt="Birthday album photo"><div class="danmaku-lane" id="danmakuLane" aria-live="polite"></div></div>
    <div class="memory-meta"><span id="photoDate"></span><button class="delete-photo" id="deletePhoto" type="button">Remove photo</button></div>
    <div class="message-area"><label for="messageInput">LEAVE A LITTLE NOTE</label><div class="emoji-choices" id="emojiChoices" aria-label="Birthday emoji"><button type="button" class="chosen" data-emoji="🎂">🎂</button><button type="button" data-emoji="🎈">🎈</button><button type="button" data-emoji="🎁">🎁</button><button type="button" data-emoji="✨">✨</button><button type="button" data-emoji="🥳">🥳</button></div><form id="messageForm"><input id="messageInput" maxlength="100" placeholder="Write a birthday wish…" required><button type="submit">SEND ↗</button></form><p class="message-count" id="messageCount"></p></div>
  </dialog>
  <script src="album.js?v=3"></script>
  <script src="app-frame.js?v=1"></script>
</body>
</html>
